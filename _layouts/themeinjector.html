<link rel="stylesheet" id="hljs-theme" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
<script>
  (function() {
    var theme = document.documentElement.getAttribute('data-theme');
    if (theme !== 'dark') {
      document.getElementById('hljs-theme').href =
        'https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-light.min.css';
    }
  })();
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/css.min.js"></script>

<style>
  .ti-sidebar {
    display: none;
    position: fixed;
    left: calc(50% - 620px);
    width: 200px;
    box-sizing: border-box;
    overflow-y: auto;
    max-height: calc(100vh - 40px);
    padding: 1rem 0.85rem;
    background: var(--surface-deep);
    border: 1px solid var(--border);
    border-radius: 8px;
    z-index: 10;
    scrollbar-width: thin;
    scrollbar-color: var(--border) transparent;
  }
  .ti-sidebar::-webkit-scrollbar { width: 6px; }
  .ti-sidebar::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
  .ti-sidebar::-webkit-scrollbar-track { background: transparent; }

  .ti-sidebar-title {
    font-size: 0.75rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    margin-bottom: 1.25rem;
  }
  .ti-sidebar-title a,
  .ti-sidebar-title a:visited { color: var(--accent-orange); text-decoration: none; }
  .ti-sidebar-title a:hover { opacity: 0.8; }

  .ti-sidebar nav a {
    display: block;
    padding: 0.2rem 0;
    padding-left: 0.6rem;
    font-size: 0.78rem;
    color: var(--muted);
    text-decoration: none;
    border-left: 2px solid transparent;
    transition: color 0.15s;
    line-height: 1.35;
  }
  .ti-sidebar nav a:hover { color: var(--strong-text); text-decoration: none; }
  .ti-sidebar nav a.active { color: var(--accent-orange); border-left-color: var(--accent-orange); }
  .ti-sidebar nav a.toc-h3 { padding-left: 1.2rem; font-size: 0.74rem; }

  .ti-wrap { max-width: 100%; }

  .ti-toggle {
    display: none !important;
    position: fixed;
    top: 1rem;
    left: 1rem;
    z-index: 200;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text);
    font-size: 1.4rem;
    width: 40px;
    height: 40px;
    cursor: pointer;
    line-height: 1;
  }

  .ti-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.6);
    z-index: 50;
  }
  .ti-overlay.show { display: block; }

  @media (min-width: 1240px) {
    .ti-sidebar { display: block; top: 5rem; }
  }
  @media (max-width: 1239px) {
    .ti-toggle { display: block !important; }
    .ti-sidebar.open { display: block; left: 0; top: 0; height: 100vh; max-height: 100vh; border-radius: 0 8px 8px 0; z-index: 100; }
  }

  /* Section content styles */
  .ti-wrap h1 { font-size: 1.75em; margin-bottom: 5px; color: var(--accent-blue); }
  .ti-wrap h2 { font-size: 1.35em; margin-top: 2.5rem; padding-bottom: 0.3rem; border-bottom: 1px solid var(--border); }
  .ti-wrap h3 { font-size: 1.1em; margin-top: 1.8rem; }
  .ti-wrap h4 { font-size: 1em; margin-top: 1.5rem; color: var(--accent-blue); }
  .ti-wrap .section-number { color: var(--accent-orange); }
  .ti-wrap .subtitle { color: var(--text-muted); font-size: 1.1rem; margin-bottom: 2rem; }

  .ti-wrap code {
    background: var(--code-inline-bg); padding: 2px 6px; border-radius: 3px;
    font-family: 'Berkeley Mono', 'SF Mono', SFMono-Regular, Consolas, monospace; color: var(--code-inline-text);
    font-size: 0.9em;
  }
  .ti-wrap pre {
    background: var(--code-block-bg); padding: 18px; border-radius: 8px;
    overflow-x: auto; margin: 15px 0; border: 1px solid var(--code-border);
    font-size: 13px;
  }
  .ti-wrap pre code {
    background: none; padding: 0; color: var(--code-block-text); display: block; line-height: 1.6;
  }

  /* Callout boxes */
  .ti-wrap .callout {
    border-radius: 0 8px 8px 0; padding: 15px 20px; margin: 20px 0;
    border-left: 4px solid var(--accent-blue); background: var(--surface);
  }
  .ti-wrap .callout-title { font-weight: 700; margin-bottom: 8px; }
  .ti-wrap .callout-cdp { border-left-color: #61afef; }
  .ti-wrap .callout-cdp .callout-title { color: #61afef; }
  .ti-wrap .callout-design { border-left-color: #98c379; }
  .ti-wrap .callout-design .callout-title { color: #98c379; }
  .ti-wrap .callout-arch { border-left-color: #c678dd; }
  .ti-wrap .callout-arch .callout-title { color: #c678dd; }
  .ti-wrap .callout-warn { border-left-color: var(--accent-red); }
  .ti-wrap .callout-warn .callout-title { color: var(--accent-red); }
  .ti-wrap .callout-tip { border-left-color: var(--accent-orange); }
  .ti-wrap .callout-tip .callout-title { color: var(--accent-orange); }

  /* Tag system */
  .ti-wrap .tag {
    display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 0.75em;
    font-weight: 600; vertical-align: middle;
  }
  .ti-wrap .tag-cdp { background: rgba(97,175,239,0.15); color: #61afef; }
  .ti-wrap .tag-design { background: rgba(152,195,121,0.15); color: #98c379; }
  .ti-wrap .tag-arch { background: rgba(198,120,221,0.15); color: #c678dd; }

  .ti-wrap .diagram {
    background: var(--surface-deep); border: 1px solid var(--border); border-radius: 8px;
    padding: 20px; margin: 20px 0; font-family: 'Berkeley Mono', 'SF Mono', monospace;
    font-size: 0.85em; white-space: pre; overflow-x: auto; line-height: 1.5;
  }

  .ti-wrap table { border-collapse: collapse; margin: 15px 0; width: 100%; }
  .ti-wrap th, .ti-wrap td { border: 1px solid var(--border); padding: 8px 14px; text-align: left; }
  .ti-wrap th { background: var(--surface); color: var(--accent-blue); }

  .ti-wrap ul, .ti-wrap ol { padding-left: 25px; margin: 10px 0; }
  .ti-wrap li { margin: 5px 0; }

  /* Section navigation */
  .ti-wrap .section-nav {
    display: flex; justify-content: space-between; margin: 40px 0 20px;
    padding-top: 20px; border-top: 1px solid var(--border);
  }
  .ti-wrap .section-nav a {
    color: var(--accent-orange); text-decoration: none; padding: 10px 18px;
    background: var(--surface); border-radius: 6px;
  }
  .ti-wrap .section-nav a:hover { background: var(--surface-hover); }

  /* Hero (index page) */
  .ti-wrap .hero { text-align: center; padding: 2rem 0 1rem; }
  .ti-wrap .hero h1 { font-size: 2em; line-height: 1.3; }
  .ti-wrap .hero .subtitle { font-size: 1.15em; max-width: 700px; margin: 0.5rem auto 1.5rem; }
  .ti-wrap .tech-stack { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin: 1.5rem 0; }
  .ti-wrap .tech-stack span {
    background: var(--surface); border: 1px solid var(--border); border-radius: 6px;
    padding: 4px 12px; font-size: 0.85em; color: var(--muted);
  }
  .ti-wrap .arc-label {
    font-size: 0.8rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em;
    color: var(--muted); margin: 2rem 0 0.5rem; padding-left: 4px;
  }
  .ti-wrap .section-list { list-style: none; padding: 0; }
  .ti-wrap .section-list li { margin: 8px 0; }
  .ti-wrap .section-list a {
    display: flex; align-items: center; gap: 15px;
    padding: 14px 18px; background: var(--surface); border-radius: 10px;
    color: var(--text); text-decoration: none; transition: all 0.2s;
    border: 1px solid transparent;
  }
  .ti-wrap .section-list a:hover { border-color: var(--accent-orange); background: var(--surface-hover); }
  .ti-wrap .section-num {
    font-size: 1.4em; font-weight: 700; color: var(--accent-orange);
    min-width: 32px; text-align: center;
  }
  .ti-wrap .section-info .title { font-weight: 600; margin-bottom: 2px; }
  .ti-wrap .section-info .desc { font-size: 0.85em; color: var(--muted); }

  .ti-wrap .checkpoint {
    border: 1px solid var(--accent-blue); border-radius: 8px; padding: 15px 20px; margin: 20px 0;
    background: var(--surface);
  }
  .ti-wrap .checkpoint h3 { margin-top: 0; color: var(--accent-blue); }

  .ti-wrap .color-swatch {
    display: inline-block; width: 16px; height: 16px; border-radius: 3px;
    vertical-align: middle; margin-right: 6px; border: 1px solid var(--border);
  }
</style>

<button class="ti-toggle" onclick="document.querySelector('.ti-sidebar').classList.toggle('open');document.querySelector('.ti-overlay').classList.toggle('show');">&#9776;</button>
<div class="ti-overlay" onclick="document.querySelector('.ti-sidebar').classList.remove('open');this.classList.remove('show');"></div>

<aside class="ti-sidebar">
  <div class="ti-sidebar-title"><a href="/projects/theme-injector/tutorial/">Theme Injector</a></div>
  <nav id="ti-toc"></nav>
</aside>

<div class="ti-wrap">
{{ content }}
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
  hljs.highlightAll();

  // Build TOC from headings
  var headings = document.querySelectorAll('.ti-wrap h2[id], .ti-wrap h3[id]');
  var tocNav = document.getElementById('ti-toc');
  if (tocNav && headings.length > 0) {
    headings.forEach(function(h) {
      var a = document.createElement('a');
      a.href = '#' + h.id;
      a.textContent = h.textContent;
      if (h.tagName === 'H3') a.classList.add('toc-h3');
      tocNav.appendChild(a);
    });

    // Active section tracking
    var tocLinks = tocNav.querySelectorAll('a');
    var observer = new IntersectionObserver(function(entries) {
      entries.forEach(function(entry) {
        if (entry.isIntersecting) {
          tocLinks.forEach(function(l) { l.classList.remove('active'); });
          var active = tocNav.querySelector('a[href="#' + entry.target.id + '"]');
          if (active) active.classList.add('active');
        }
      });
    }, { rootMargin: '-80px 0px -70% 0px' });
    headings.forEach(function(h) { observer.observe(h); });
  }
});
</script>
